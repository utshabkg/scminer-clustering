name: scminer
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - scanpy
  - anndata
  - h5py
  - python-igraph
  - leidenalg
  - matplotlib
  - seaborn
  - psutil
  - ipykernel
  - pytest
  - pip
  - pip:
      - torch
      - rdata
      - scikit-misc
      - tabulate
# Install the project itself afterwards with `pip install -e .` from the repository root
# (README.md). conda runs this pip step from envs/, so `-e .` here would point at the wrong folder.
